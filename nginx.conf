# konai-web-front: 静的ファイルの配信と、/api/ → API サーバ(compose の api サービス)への転送
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ブラウザからは同一オリジンの /api/... を叩く(CORS 不要)。先頭の /api/ を剥がして転送する
  location /api/ {
    # 起動時ではなくリクエスト時に名前解決する(compose 外で単体起動しても nginx が落ちない)。
    # 127.0.0.11 は Docker の内蔵 DNS
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # API の電球待ち(5 秒)より長く
    proxy_read_timeout 15s;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # nginx 既定の mime.types に無い拡張子
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # Vite はハッシュ付きファイル名で出力するので長期キャッシュにできる
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
